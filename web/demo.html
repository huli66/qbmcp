<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>qbmcp · 网页桥接测试</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;background:#f4f6fa;color:#182238;max-width:900px;margin:40px auto;padding:0 24px}section{background:white;border:1px solid #dce2ec;border-radius:12px;padding:22px;margin:18px 0}h1{margin-bottom:0}h2{font-size:18px}input{padding:10px;border:1px solid #aab6cb;border-radius:6px;width:min(440px,90%)}button{padding:10px 18px;background:#2358bb;color:white;border:0;border-radius:6px;cursor:pointer;margin:8px 4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace}#log{max-height:300px;overflow:auto}small{color:#56647b}#target{padding:18px;background:#edf3ff;border-radius:8px}
</style>
<h1>qbmcp 网页桥接</h1>
<p>保持页面打开，agent 就能读取演示数据或修改下方文字。</p>
<section><label for="token">连接 token</label><br><input id="token" type="password" autocomplete="off" placeholder="粘贴 config.json 中的 token"><button id="connect">连接</button><button id="disconnect">断开</button><p id="status" role="status">未连接</p><small>token 仅保存在当前页面内存中，刷新后需要重新输入。被其他页面替换后不会自动抢回连接。</small></section>
<section><h2>已注册工具</h2><pre id="tools"></pre></section>
<section><h2>DOM 演示区域</h2><div id="target">等待 agent 修改这段文字。</div></section>
<section><h2>请求日志</h2><pre id="log"></pre></section>
<script>
const $=id=>document.getElementById(id);
const defs=[
 {name:'demo_load_data',description:'通过网页 fetch 加载演示 API 数据',kind:'api',inputSchema:{type:'object',additionalProperties:false},outputSchema:{type:'object',properties:{items:{type:'array',items:{type:'string'}},source:{type:'string'}},required:['items','source']}},
 {name:'demo_set_text',description:'修改演示区域文本并返回修改结果',kind:'dom',inputSchema:{type:'object',properties:{text:{type:'string',maxLength:10000}},required:['text'],additionalProperties:false},outputSchema:{type:'object',properties:{text:{type:'string'}},required:['text']}}
];
$('tools').textContent=JSON.stringify(defs,null,2);
let socket=null, connectionId='',retry=0,timer=null,manual=true;
const log=text=>{const lines=$('log').textContent.split('\n').filter(Boolean);lines.push(new Date().toLocaleTimeString()+' '+text);$('log').textContent=lines.slice(-100).join('\n');};
function connect(){
 clearTimeout(timer);manual=false;
 if(socket){socket.cancelAll?.();socket.onclose=null;socket.close();}
 const ws=new WebSocket(location.origin.replace(/^http/,'ws')+'/ws');socket=ws;
 let cid='', chain=Promise.resolve();const running=new Map(),canceled=new Set();
 ws.cancelAll=()=>{for(const controller of running.values())controller.abort();};
 const send=m=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({version:1,connectionId:cid,...m}));};
 ws.onopen=()=>{ $('status').textContent='正在认证';send({type:'hello',token:$('token').value,pageId:'demo'}); };
 ws.onmessage=e=>{
  if(socket!==ws)return;
  const m=JSON.parse(e.data);
  if(m.type==='hello_ack'){cid=m.connectionId;connectionId=cid;retry=0;send({type:'register_tools',tools:defs});$('status').textContent='已连接，正在注册工具';}
  else if(m.type==='register_ack'){$('status').textContent='已连接 · 工具已就绪';log('工具注册成功，版本 '+m.schemaVersion);}
  else if(m.type==='request_tools'){send({type:'register_tools',id:m.id,tools:defs});}
  else if(m.type==='cancel'){if(running.has(m.id)){canceled.add(m.id);running.get(m.id).abort();}}
  else if(m.type==='call_tool'){
   const controller=new AbortController();running.set(m.id,controller);
   chain=chain.then(async()=>{
    try{
     if(canceled.has(m.id)||controller.signal.aborted)throw new Error('任务已取消');
     log('开始 '+m.name);
     let result;
     if(m.name==='demo_load_data'){
      const response=await fetch('/demo/api/data',{signal:controller.signal});
      if(!response.ok)throw new Error('API 返回 '+response.status);
      result=await response.json();
     }else if(m.name==='demo_set_text'){
      if(typeof m.arguments?.text!=='string')throw new Error('text 必须是字符串');
      $('target').textContent=m.arguments.text;result={text:$('target').textContent};
     }else throw new Error('未知工具');
     if(!canceled.has(m.id)&&!controller.signal.aborted){send({type:'tool_result',id:m.id,result});log('完成 '+m.name);}
    }catch(error){if(!canceled.has(m.id))send({type:'tool_result',id:m.id,error:{code:'PAGE_ERROR',message:error.message}});log('结束 '+m.name+': '+error.message);}
    finally{running.delete(m.id);canceled.delete(m.id);}
   });
  }else if(m.type==='error'){log(m.error.code+': '+m.error.message);}
 };
 ws.onclose=e=>{
  for(const controller of running.values())controller.abort();
  if(socket!==ws)return;
  socket=null;connectionId='';
  if(e.code===4001||e.code===4003){manual=true;$('status').textContent=e.code===4001?'已被新网页替换，点击连接可手动接管':'认证失败，请检查 token';return;}
  $('status').textContent='连接已断开';
  if(!manual){const delay=Math.min(30000,1000*2**retry++);timer=setTimeout(connect,delay);log('将在 '+delay/1000+' 秒后重连');}
 };
 ws.onerror=()=>log('连接失败，请检查服务和浏览器本地网络访问权限');
}
$('connect').onclick=()=>{if(!$('token').value){$('status').textContent='请先输入 token';return;}retry=0;connect();};
$('disconnect').onclick=()=>{manual=true;clearTimeout(timer);socket?.close(1000,'user disconnected');};
</script>
</html>
